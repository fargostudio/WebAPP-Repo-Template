version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./apps/backend/logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped

  # Uncomment if you need a database
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: webapp
  #     POSTGRES_PASSWORD: webapp_password
  #     POSTGRES_DB: webapp_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - '5432:5432'
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

